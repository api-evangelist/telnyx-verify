description: >-
  FinOps view of Telnyx Verify and Number Lookup spend. Both are pay-as-you-go,
  usage-metered products with no subscription floor. Verify cost is driven by
  the number of successful verifications plus the channel-delivery cost (SMS,
  voice, flash call, WhatsApp) of each code sent; failed or unattempted
  verifications and the chosen channel mix therefore materially change unit
  economics. Number Lookup cost is driven by the number of lookups (LRN dips),
  with optional CNAM caller-name adding cost. Spend maps cleanly to product
  events, so tagging by app, campaign, or workload is the primary lever.
notes: >-
  Per-unit rates are grounded from Telnyx public pricing as of the created date
  ($0.03 per successful verification plus channel cost; Number Lookup from
  $0.0015 per dip) but should be reconciled before budgeting. Channel-delivery
  cost follows Telnyx Messaging/Voice rates and varies by destination country.
