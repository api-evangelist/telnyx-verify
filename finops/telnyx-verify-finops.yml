meters:
- name: successful_verifications
  description: Successful verifications, billed per verification across channels.
  unit: verifications
  aggregation: sum
  dimensions:
  - account
  - verify_profile
  - channel
- name: channel_delivery
  description: SMS / voice / flash call / WhatsApp delivery cost for the message carrying the code.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - channel
  - destination_country
- name: number_lookups
  description: Number Lookup requests (LRN dips) returning carrier / caller-name / portability.
  unit: lookups
  aggregation: sum
  dimensions:
  - account
  - lookup_type
principles:
- name: Visibility
  description: Track verifications and lookups per app and campaign; separate the verification fee from channel-delivery cost so channel mix is visible.
- name: Allocation
  description: Use a Verify profile (and its name) per application or brand so verification and channel spend map to cost centers.
- name: Optimization
  description: Prefer lower-cost channels where UX allows (flash call vs SMS), cap resends, set sensible code-expiry timeouts, and only request CNAM caller-name on lookups when needed.
- name: Accountability
  description: Assign owners per Verify profile; review monthly verification and lookup volume against fraud/abuse baselines and budget.
