aid: telnyx-verify
url: https://raw.githubusercontent.com/api-evangelist/telnyx-verify/refs/heads/main/apis.yml
name: Telnyx Verify API
kind: company
description: >-
  Telnyx Verify API is a phone-number verification and two-factor
  authentication (2FA / OTP) product, paired with Telnyx Number Lookup for
  number intelligence (carrier, line type, caller name / CNAM, and
  portability). Verify sends a one-time passcode over SMS, voice call, flash
  call, or WhatsApp and checks the code the user enters - by verification ID or
  by phone number - with reusable per-channel Verify Profiles and message
  templates, plus verification webhooks and built-in anti-fraud controls
  against SMS pumping and brute-force attacks. Number Lookup returns carrier and
  caller data for an E.164 number for routing, validation, lead enrichment, and
  fraud workflows. Both run on the Telnyx API v2 (https://api.telnyx.com/v2)
  with Bearer API-key auth. This is a product-specific treatment of the parent
  Telnyx cloud-communications (CPaaS) platform, whose full voice / messaging /
  numbers / fax / wireless surface is documented in the `telnyx` catalog entry.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Number Verification
- Phone Verification
- OTP
- 2FA
- Lookup
- Verify
- Number Lookup
- CNAM
- Identity
- Anti-Fraud
